<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:#f8f8f8; color:#000; padding:70px 15px 70px; line-height:1.5; }
        .header { position:fixed; top:0; left:0; right:0; background:#fff; border-bottom:1px solid #eee; padding:12px 20px; z-index:999; height:70px; }
        .header h1 { font-size:18px; font-weight:600; text-align:center; margin-bottom:8px; }
        .search-box { width:100%; display:flex; gap:8px; }
        .search-input { flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
        .search-btn { 
            padding:8px 16px; 
            background:#000; 
            color:#fff; 
            border:none; 
            border-radius:6px; 
            font-size:14px; 
            cursor:pointer; 
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .container { width:100%; }
        .card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:18px; margin-bottom:15px; }
        .card-title { font-size:16px; font-weight:600; margin-bottom:15px; }
        .tag-group { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:15px; }
        .tag { padding:6px 12px; background:#fafafa; border:1px solid #ddd; border-radius:6px; font-size:14px; cursor:pointer; }
        .tag.active { background:#000; color:#fff; border-color:#000; }
        .resource-list { display:flex; flex-direction:column; gap:10px; }
        .resource-card { padding:12px; background:#fafafa; border:1px solid #eee; border-radius:6px; }
        .resource-card a { text-decoration:none; color:#000; display:block; }
    </style>
    <style>
        .resource-title { font-size:15px; margin-bottom:5px; }
        .resource-meta { font-size:12px; color:#666; }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:flex; justify-content:space-around; padding:10px 0; z-index:999; }
        .nav-item { display:flex; flex-direction:column; align-items:center; font-size:12px; cursor:pointer; }
        .nav-item i { font-size:20px; margin-bottom:3px; }
        .nav-item.active { font-weight:600; }
        .hidden { display:none; }
        /* 修复页面下沉：确保固定导航不遮挡内容 */
        .page { width:100%; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>

<script>
        // 补充影视大全隐藏资源（13条，仅搜索可见）
        allResources.push(
            {id:33,keyword:"空姐",title:"视频-空姐",link:"https://pan.quark.cn/s/54b8ae8feb51",categoryId:3, isHidden:true},
            {id:34,keyword:"杨凯莉",title:"视频-杨凯莉",link:"https://pan.quark.cn/s/193c740af624",categoryId:3, isHidden:true},

            {id:43,keyword:"可爱",title:"视频-可爱",link:"https://pan.quark.cn/s/80f3ce49d7ed",categoryId:3, isHidden:true},

        );
        // 存储资源到本地存储
        localStorage.dimRes=JSON.stringify(allResources);
        // 工具函数：获取分类和资源
        const getCats=()=>JSON.parse(localStorage.dimCats)||[];
        const getRes=()=>JSON.parse(localStorage.dimRes)||[];
    </script>
<script>
        // 3. 渲染首页分类标签
        function renderHomeTags(){
            const cats=getCats();
            const container=document.getElementById('home-tags');
            container.innerHTML='';
            // 全部资源标签
            const allTag=document.createElement('div');
            allTag.className='tag active';
            allTag.textContent='全部资源';
            allTag.addEventListener('click',()=>{
                switchToDiscover();
                renderDiscoverRes(0);
            });
            container.appendChild(allTag);
            // 各分类标签
            cats.forEach(cat=>{
                const tag=document.createElement('div');
                tag.className='tag';
                tag.textContent=cat.name;
                tag.dataset.id=cat.id;
                tag.addEventListener('click',()=>{
                    switchToDiscover();
                    renderDiscoverRes(cat.id);
                    // 同步发现页标签激活状态
                    document.querySelectorAll('#discover-tags .tag').forEach(t=>t.classList.remove('active'));
                    document.querySelector(`#discover-tags .tag[data-id="${cat.id}"]`).classList.add('active');
                });
                container.appendChild(tag);
            });
        }
        // 4. 渲染发现页分类标签
        function renderDiscoverTags(){
            const cats=getCats();
            const container=document.getElementById('discover-tags');
            container.innerHTML='';
            // 全部资源标签
            const allTag=document.createElement('div');
            allTag.className='tag active';
            allTag.textContent='全部资源';
            allTag.dataset.id='0';
            allTag.addEventListener('click',()=>{
                renderDiscoverRes(0);
                document.querySelectorAll('#discover-tags .tag').forEach(t=>t.classList.remove('active'));
                allTag.classList.add('active');
            });
            container.appendChild(allTag);
            // 各分类标签
            cats.forEach(cat=>{
                const tag=document.createElement('div');
                tag.className='tag';
                tag.textContent=cat.name;
                tag.dataset.id=cat.id;
                tag.addEventListener('click',()=>{
                    renderDiscoverRes(cat.id);
                    document.querySelectorAll('#discover-tags .tag').forEach(t=>t.classList.remove('active'));
                    tag.classList.add('active');
                });
                container.appendChild(tag);
            });
        }
    </script>
<script>
        // 5. 切换到发现页
        function switchToDiscover(){
            document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
            document.getElementById('discover').classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            document.querySelector('[data-page="discover"]').classList.add('active');
            // 确保发现页标签已渲染
            if(!document.getElementById('discover-tags').firstChild){
                renderDiscoverTags();
            }
        }
        // 6. 渲染发现页资源列表（核心修复：解决下沉和隐藏逻辑）
        function renderDiscoverRes(catId=0){
            const res=getRes();
            const container=document.getElementById('discover-resources');
            container.innerHTML='';
            // 先添加隐藏关键词超链接
            const hiddenLink=document.createElement('div');
            hiddenLink.className='resource-card';
            hiddenLink.style.marginTop='10px';
            hiddenLink.style.textAlign='center';
            hiddenLink.innerHTML=`<a href="https://qm.qq.com/q/trz8RumE5q" target="_blank" style="color:#666; text-decoration:underline;">隐藏关键词</a>`;
            container.appendChild(hiddenLink);
            // 筛选资源：排除影视大全隐藏资源（仅搜索可见）
            const filtered=catId?
                res.filter(r=>r.categoryId===catId && !(r.categoryId===3 && r.isHidden)):
                res.filter(r=>!(r.categoryId===3 && r.isHidden));
            // 无资源提示
            if(filtered.length===0){
                const noResult=document.createElement('div');
                noResult.style.textAlign='center';
                noResult.style.padding='20px 0';
                noResult.style.color='#666';
                noResult.textContent='该分类暂无资源~';
                container.appendChild(noResult);
                return;
            }
            // 渲染资源卡片
            filtered.forEach(item=>{
                const card=document.createElement('div');
                card.className='resource-card';
                const catName=getCats().find(c=>c.id===item.categoryId)?.name||'未知分类';
                card.innerHTML=`<a href="${item.link}" target="_blank"><div class="resource-title">${item.title}</div><div class="resource-meta">关键词：${item.keyword} | 分类：${catName}</div></a>`;
                container.appendChild(card);
            });
        }
    </script>
<script>
        // 7. 搜索功能（核心修复：仅关键词精准匹配，含隐藏资源）
        function doSearch(){
            const keyword=document.getElementById('home-search').value.trim();
            if(!keyword){
                alert('请输入关键词后再搜索！');
                return;
            }
            // 精准匹配关键词（忽略大小写）
            const res=getRes().filter(r=>
                r.keyword.toLowerCase()===keyword.toLowerCase()
            );
            // 切换到发现页并渲染结果
            switchToDiscover();
            const container=document.getElementById('discover-resources');
            container.innerHTML='';
            // 添加隐藏关键词超链接
            const hiddenLink=document.createElement('div');
            hiddenLink.className='resource-card';
            hiddenLink.style.marginTop='10px';
            hiddenLink.style.textAlign='center';
            hiddenLink.innerHTML=`<a href="https://qm.qq.com/q/trz8RumE5q" target="_blank" style="color:#666; text-decoration:underline;">隐藏关键词</a>`;
            container.appendChild(hiddenLink);
            // 无结果提示
            if(res.length===0){
                const noResult=document.createElement('div');
                noResult.style.textAlign='center';
                noResult.style.padding='20px 0';
                noResult.style.color='#666';
                noResult.textContent='未找到匹配资源，请更换关键词重试~';
                container.appendChild(noResult);
                return;
            }
            // 渲染搜索结果
            res.forEach(item=>{
                const card=document.createElement('div');
                card.className='resource-card';
                const catName=getCats().find(c=>c.id===item.categoryId)?.name||'未知分类';
                card.innerHTML=`<a href="${item.link}" target="_blank"><div class="resource-title">${item.title}</div><div class="resource-meta">关键词：${item.keyword} | 分类：${catName}</div></a>`;
                container.appendChild(card);
            });
        }
        // 绑定搜索事件
        document.getElementById('search-btn').addEventListener('click',doSearch);
        document.getElementById('home-search').addEventListener('keydown',(e)=>{
            if(e.key==='Enter')doSearch();
        });
    </script>
<script>
        // 8. 页面初始化
        window.onload=function(){
            // 渲染首页分类
            renderHomeTags();
            // 初始化发现页标签（避免切换时延迟）
            renderDiscoverTags();
            // 修复页面加载时的布局偏移
            document.body.style.paddingTop='70px';
            document.body.style.paddingBottom='70px';
        };
        // 额外优化：点击导航切换页面
        document.querySelectorAll('.nav-item').forEach(item=>{
            item.addEventListener('click',function(){
                const page=this.dataset.page;
                document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
                document.getElementById(page).classList.remove('hidden');
                document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
                this.classList.add('active');
                // 切换到发现页时渲染全部资源
                if(page==='discover'){
                    renderDiscoverRes(0);
                }
            });
        });
    </script>
</body>
</html>
